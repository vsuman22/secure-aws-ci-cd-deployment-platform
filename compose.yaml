services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: secure-aws-ci-cd-platform:${APP_VERSION:-1.0.0}
    container_name: secure-aws-ci-cd-platform-app
    ports:
      - "${HOST_PORT:-5000}:5000"
    environment:
      APP_VERSION: ${APP_VERSION:-1.0.0}
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s